{% extends "blog/base.html" %}
{% block content %}
<div style="max-width:400px;margin:50px auto;padding:30px;background:#1a1a2e;border-radius:10px;text-align:center;">
  <h2 style="color:white;margin-bottom:30px;">Login</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="width:100%;padding:12px;background:#e74c3c;color:white;border:none;border-radius:5px;font-size:16px;cursor:pointer;">Login</button>
  </form>
  <hr style="margin:20px 0;border-color:#333;">
  <a href="/accounts/google/login/" style="display:block;padding:12px;background:#4285f4;color:white;border-radius:5px;text-decoration:none;font-size:16px;">🔵 Login with Google</a>
  <p style="color:#aaa;margin-top:15px;">Account இல்லையா? <a href="/accounts/register/" style="color:#e74c3c;">Register செய்யுங்கள்</a></p>
</div>
{% endblock %}
